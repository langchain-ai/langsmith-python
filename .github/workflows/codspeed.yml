name: CodSpeed

# Main runs record the baseline PR runs compare against, so setup files are
# listed too: a dependency bump that shifts performance must refresh it.
on:
  push:
    branches: [main]
    paths:
      - "src/langsmith/**"
      - "bench/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    paths:
      - "src/langsmith/**"
      - "bench/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: "Python Benchmarks (${{ matrix.mode }})"
    # Same-repo PRs only: forks would pollute the baseline and reach the self-hosted runner.
    if: github.repository == 'langchain-ai/langsmith-python-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    # CodSpeed's bare-metal runners; hosted runners swap CPU models between runs.
    runs-on: codspeed-macro
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # simulation (Valgrind) disabled: too slow on ARM64 macro runners.
        include:
          - mode: memory
          - mode: walltime
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12+ has the perf trampoline pytest-codspeed needs for flame graphs.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --group bench

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: ${{ matrix.mode }}
          # --timeout=0 drops the 120s pytest-timeout sized for unit tests.
          run: uv run pytest bench/test_bench.py --codspeed --timeout=0

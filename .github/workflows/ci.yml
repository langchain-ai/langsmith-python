name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'

      - name: Install dependencies
        run: uv sync --group dev --group lint --extra aiohttp

      - name: Run lints
        run: ./scripts/lint

  test:
    timeout-minutes: 20
    name: "test ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev --group lint --group test
          uv pip install langchain

      - name: Run tests
        run: ./scripts/test

  build:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'

      - name: Install dependencies
        run: uv sync --group dev --group lint --extra aiohttp

      - name: Run build
        run: uv build

  wheel-test:
    timeout-minutes: 10
    name: "wheel test (strict deps)"
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'
          python-version: '3.11'

      - name: Protect wheel dependency installs
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Check declared runtime deps are sufficient
        run: ./scripts/test-wheel-imports

  deepagent-compat:
    timeout-minutes: 10
    name: "deepagent compat"
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'
          python-version: '3.11'

      - name: Install local langsmith and deepagents
        # pytest installed here, not from the dev group: --no-sync below keeps
        # uv from resyncing .venv and downgrading langchain-core under deepagents.
        run: |
          uv venv --clear
          uv pip install -e . deepagents pytest

      - name: Run smoke test
        # -o addopts= drops pyproject's `-n auto`; xdist is not in this venv.
        run: uv run --no-sync python -m pytest -o addopts= tests/external/test_deepagent_compat.py -v --noconftest

  ci-success:
    name: "CI Success"
    needs: [lint, test, build, wheel-test, deepagent-compat]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
    steps:
      - run: |
          echo "$RESULTS_JSON"
          if echo "$RESULTS_JSON" | grep -qE '"(failure|cancelled)"'; then
            echo "CI failed"; exit 1
          fi

name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  schedule:
    # Nightly: every job, every environment, Slack on failure.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      integration-environment:
        description: LangSmith environment for the integration suite
        type: choice
        default: beta
        options: [beta, v16-ch-only, v16-dual, v16-smithdb-only, all]
      exit-first:
        description: Stop each shard at its first failure
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'

      - name: Install dependencies
        run: uv sync --group dev --group lint --extra aiohttp

      - name: Test mirror formatting
        run: .github/scripts/test-format-mirror.sh

      - name: Run lints
        run: ./scripts/lint

  test:
    timeout-minutes: 20
    name: "test ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev --group lint --group test
          uv pip install langchain

      - name: Run tests
        run: ./scripts/test

  build:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'

      - name: Install dependencies
        run: uv sync --group dev --group lint --extra aiohttp

      - name: Run build
        run: uv build

  wheel-test:
    timeout-minutes: 10
    name: "wheel test (strict deps)"
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: '3.11'

      - name: Protect wheel dependency installs
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Check declared runtime deps are sufficient
        run: ./scripts/test-wheel-imports

  deepagent-compat:
    timeout-minutes: 10
    name: "deepagent compat"
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: '3.11'

      - name: Install local langsmith and deepagents
        # pytest installed here, not from the dev group: --no-sync below keeps
        # uv from resyncing .venv and downgrading langchain-core under deepagents.
        run: |
          uv venv --clear
          uv pip install -e . deepagents pytest

      - name: Run smoke test
        # -o addopts= drops pyproject's `-n auto`; xdist is not in this venv.
        run: uv run --no-sync python -m pytest -o addopts= tests/external/test_deepagent_compat.py -v --noconftest

  # Live suite against a LangSmith deployment: main pushes hit beta, the
  # nightly hits every environment, a dispatch picks one. No doctest leg:
  # langsmith-sdk lists one but its action never runs it, and the doctests fail.
  integration-matrix:
    name: "integration matrix"
    runs-on: ubuntu-latest
    # Staging only: the prod repo has no API-key secrets and receives promoted code.
    if: github.repository == 'langchain-ai/langsmith-python-staging' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          SELECTED: ${{ github.event_name == 'schedule' && 'all' || github.event.inputs.integration-environment || 'beta' }}
        run: |
          python3 <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          ENDPOINTS = {
              "beta": "https://beta.api.smith.langchain.com",
              "v16-ch-only": "https://aks.smith.langchain.dev/api",
              "v16-dual": "https://stable-dual.eks.smith.langchain.dev/api",
              "v16-smithdb-only": "https://stable-smithdb.eks.smith.langchain.dev/api",
          }
          # SmithDB-only backends lack the legacy ClickHouse endpoints; ClickHouse-only lacks v2.
          EXCLUDED = {"v16-ch-only": ["require_v2"], "v16-smithdb-only": ["require_clickhouse"]}
          SHARDS = 6
          selected = os.environ["SELECTED"]
          envs = list(ENDPOINTS) if selected == "all" else [selected if selected in ENDPOINTS else "beta"]
          include = []
          for env in envs:
              markers = " and ".join(f"not {m}" for m in EXCLUDED.get(env, []))
              base = {
                  "environment": env,
                  "endpoint": ENDPOINTS[env],
                  "suffix": "" if env == "beta" else f" [{env}]",
                  "addopts": f'-m "{markers}"' if markers else "",
              }
              include += [{**base, "type": "integration", "shard": i} for i in range(SHARDS)]
              include.append({**base, "type": "evals", "shard": ""})
          print("matrix=" + json.dumps({"include": include}))
          EOF

  integration:
    name: "${{ matrix.type }} ${{ matrix.shard }}${{ matrix.suffix }}"
    needs: integration-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-matrix.outputs.matrix) }}
    env:
      LANGSMITH_TRACING_V2: "true"
      LANGSMITH_TRACING: "true"
      LANGSMITH_ENDPOINT: ${{ matrix.endpoint }}
      LANGSMITH_API_KEY: >-
        ${{ (matrix.environment == 'v16-ch-only' && secrets.LANGSMITH_API_KEY_AKS_V15)
         || (matrix.environment == 'v16-dual' && secrets.LANGSMITH_API_KEY_STABLE_DUAL)
         || (matrix.environment == 'v16-smithdb-only' && secrets.LANGSMITH_API_KEY_STABLE_SMITHDB)
         || secrets.LANGSMITH_API_KEY_BETA }}
      # Provider calls go through the prod LLM Gateway: its workspace holds all
      # three provider secrets. The LangSmith deployment under test is separate.
      OPENAI_BASE_URL: https://gateway.smith.langchain.com/openai/v1
      ANTHROPIC_BASE_URL: https://gateway.smith.langchain.com/anthropic
      GOOGLE_GEMINI_BASE_URL: https://gateway.smith.langchain.com/gemini
      OPENAI_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      ANTHROPIC_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      GEMINI_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      GOOGLE_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      LANGSMITH_TEST_CACHE: tests/cassettes
      PYTEST_ADDOPTS: ${{ matrix.addopts }}
      PYTEST_SHARD_TOTAL: ${{ matrix.type == 'integration' && '6' || '' }}
      PYTEST_SHARD_INDEX: ${{ matrix.shard }}
      # Main pushes stop at the first failure; nightly and dispatch report them all.
      PYTEST_EXIT_FIRST: ${{ (github.event_name == 'push' || github.event.inputs.exit-first == 'true') && '-x' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync --group dev --group test
          uv pip install langchain langchain-openai langchain-anthropic tiktoken rapidfuzz vcrpy numpy

      - name: Check credentials
        run: '[ -n "$LANGSMITH_API_KEY" ] || { echo "::error::No API key secret for ${{ matrix.environment }}"; exit 1; }'

      - name: Run integration tests
        if: matrix.type == 'integration'
        # Beta ingest is eventually consistent; retry read-after-write flakes suite-wide.
        run: uv run python -m pytest $PYTEST_EXIT_FIRST -n auto -v --durations=10 --reruns 2 --reruns-delay 10 tests/integration_tests

      - name: Run evals
        if: matrix.type == 'evals'
        run: uv run python -m pytest $PYTEST_EXIT_FIRST -n auto --durations=10 --reruns 2 --reruns-delay 10 tests/evaluation

  ci-success:
    name: "CI Success"
    needs: [lint, test, build, wheel-test, deepagent-compat, integration-matrix, integration]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
    steps:
      - run: |
          echo "$RESULTS_JSON"
          if echo "$RESULTS_JSON" | grep -qE '"(failure|cancelled)"'; then
            echo "CI failed"; exit 1
          fi

  # Only the nightly posts: push and PR failures are visible to whoever pushed.
  notify-slack-on-failure:
    name: "Notify Slack on nightly failure"
    needs: [ci-success]
    if: ${{ always() && github.repository == 'langchain-ai/langsmith-python-staging' && github.event_name == 'schedule' && needs.ci-success.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.INGESTION_CI_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ toJSON(secrets.INGESTION_TEAM_SLACK_CHANNEL_ID) }}
            text: |
              *Nightly langsmith-python-staging CI failed*
              *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              *Environments:* beta, v16-ch-only, v16-dual, v16-smithdb-only

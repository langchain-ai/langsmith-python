name: py-baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/langsmith/**"
      - "bench/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: 3.11
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run benchmarks
        run: |
          mkdir -p out
          uv run python -m bench -o out/benchmark-baseline.json --rigorous

      - name: Save baseline
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          key: ${{ runner.os }}-benchmark-baseline-${{ env.SHA }}
          path: out/benchmark-baseline.json

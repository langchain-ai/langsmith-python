name: py-bench-datadog

on:
  pull_request:
    paths:
      - "src/langsmith/**"
      - "bench/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/py-bench-datadog.yml"
  push:
    branches: [main]
    paths:
      - "src/langsmith/**"
      - "bench/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/py-bench-datadog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    # Fork PRs would only burn a runner: PR runs report nothing (see below).
    if: github.repository == 'langchain-ai/langsmith-python-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'
          python-version: "3.13"  # matches codspeed.yml
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --group bench

      # The Datadog installer injects ddtrace via PYTHONPATH into whatever
      # `python` is on PATH, so it must be the project venv's interpreter.
      - name: Put the project venv on PATH for the Datadog installer
        if: github.event_name != 'pull_request'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Skipped on pull_request: this exports DD_API_KEY into the job env and
      # everything after it is PR-controlled code. Datadog records main only.
      - name: Configure Datadog Test Optimization
        if: github.event_name != 'pull_request'
        uses: datadog/test-visibility-github-action@1abae93083b69778facd7ee11f89184306c999e6 # v3.2.0
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: us5.datadoghq.com
          service: langsmith-python

      # PYTEST_ADDOPTS=--ddtrace comes from the step above.
      - name: Run benchmarks
        run: uv run --group bench python -m pytest bench/test_bench.py

name: Mirror from langsmith-sdk

# Hourly: append every langsmith-sdk main commit after .mirror-source-sha that touches
# python/ to one rolling PR from mirror/langsmith-sdk, one commit per source commit
# (original author, pointer bumped in each). Never force-pushes an open PR, so fixes made
# by hand on the branch survive. Stops at the first conflict and labels the PR
# needs-manual-merge: resolve on the branch, remove the label, the next run appends the rest.
# Rebase-merge to keep the commits separate. Closing the PR discards it; the next run
# starts over from main. Skipped: langtions-bot and release(...) commits. Linear: LIN-504.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mirror-from-langsmith-sdk
  cancel-in-progress: false

env:
  LANG_KEY: python
  SOURCE_PATH: python
  SOURCE_REPO: langchain-ai/langsmith-sdk
  BRANCH: mirror/langsmith-sdk

jobs:
  mirror:
    if: github.repository == 'langchain-ai/langsmith-python-staging'
    runs-on: self-hosted-ubuntu-small-amd64
    steps:
      - name: Load GitHub App key from 1Password
        id: load-gh-app-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN_INTERNAL }}
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          LANGCHAINPLUS_GITHUB_APP_PRIVATE_KEY: op://${{ secrets.INTERNAL_INFRA_OP_VAULT }}/langchain-actions-pr-bot/private_key

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ steps.load-gh-app-secrets.outputs.LANGCHAINPLUS_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      # the triggering ref supplies the script, so a dispatch from a branch tests that branch
      - name: Check out staging
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Clone langsmith-sdk
        run: git clone --quiet "https://github.com/$SOURCE_REPO.git" ../langsmith-sdk

      - name: Protect formatter dependency installs
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'

      - name: Append new commits to the mirror branch
        id: mirror
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cp .github/scripts/mirror-from-langsmith-sdk.sh "$RUNNER_TEMP/mirror.sh"
          cp .github/scripts/format-mirror.sh "$RUNNER_TEMP/format-mirror.sh"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open \
            --json number,labels --jq '.[0] // empty')
          if [ -n "$pr" ]; then
            if jq -e '.labels | map(.name) | index("needs-manual-merge")' <<<"$pr" >/dev/null; then
              echo "Mirror PR waits for a manual merge. Remove the needs-manual-merge label once resolved."
              exit 0
            fi
            echo "pr=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
            git fetch --quiet origin "$BRANCH"
            git checkout --quiet -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --quiet -B "$BRANCH" origin/main
          fi

          staging=$PWD added=0 conflict= formatter_ready=false
          pointer=$(cat .mirror-source-sha)
          cd ../langsmith-sdk
          for sha in $(git log --reverse --format=%H "$pointer..origin/main" -- "$SOURCE_PATH"); do
            [ "$(git log -1 --format=%an "$sha")" = "langtions-bot[bot]" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in release\(*) continue ;; esac
            out=$RUNNER_TEMP/mirror-$sha
            "$RUNNER_TEMP/mirror.sh" "$LANG_KEY" "$sha" "$staging" "$out"
            if [ "$(cat "$out/status")" = clean ]; then
              if [ "$formatter_ready" = false ]; then
                (cd "$staging" && uv sync --locked --group dev --group lint --no-install-project)
                formatter_ready=true
              fi
              "$RUNNER_TEMP/format-mirror.sh" "$staging"
            fi
            echo "$sha" > "$staging/.mirror-source-sha"
            {
              # Explicit URLs keep release-please from linking to production issue numbers.
              printf '%s\n\n' "$(sed -E "s|\(#([0-9]+)\)$|([langsmith-sdk PR \1](https://github.com/$SOURCE_REPO/pull/\1))|" <<<"$subject")"
              echo "Mirrored-From: $SOURCE_REPO@$sha"
              sed 's/^/Mirror-Conflict: /' "$out/conflicts"
              sed 's/^/Mirror-Manual-Port: /' "$out/manual"
              sed 's/^/Mirror-Dropped: /' "$out/dropped"
            } > "$out/msg"
            git -C "$staging" add -A
            git -C "$staging" commit --quiet --author="$(git log -1 --format='%an <%ae>' "$sha")" -F "$out/msg"
            added=$((added + 1))
            echo "$(cat "$out/status") $sha $subject"
            if [ "$(cat "$out/status")" = conflict ]; then conflict=$out; break; fi
          done
          cd "$staging"

          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "conflict=$conflict" >> "$GITHUB_OUTPUT"
          [ "$added" = 0 ] && { echo "Up to date with $SOURCE_REPO."; exit 0; }
          # a stale branch from a merged or closed PR is safe to overwrite
          if [ -n "$pr" ]; then git push --quiet origin "HEAD:refs/heads/$BRANCH"
          else git push --quiet --force origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Keep the rewritten patch of the conflicting commit
        if: steps.mirror.outputs.conflict != ''
        uses: actions/upload-artifact@v6
        with:
          name: mirror-conflict
          path: ${{ steps.mirror.outputs.conflict }}

      - name: Open or update the PR
        id: pr
        if: steps.mirror.outputs.added != '' && steps.mirror.outputs.added != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.mirror.outputs.pr }}
          CONFLICT: ${{ steps.mirror.outputs.conflict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$RUNNER_TEMP/body.md
          {
            echo "Mirror of \`$SOURCE_REPO\` main. **Rebase-merge** to keep one commit per source commit. Closing discards it; the next run starts over from \`main\`."
            echo
            if [ -n "$CONFLICT" ]; then
              echo "**Needs manual merge.** Resolve the markers on \`$BRANCH\`, push, then remove the \`needs-manual-merge\` label so the next run appends the rest. Patch: [run artifacts]($RUN_URL)."
              echo
            fi
            for c in $(git log --reverse --format=%H origin/main..HEAD); do
              src=$(git log -1 --format='%(trailers:key=Mirrored-From,valueonly)' "$c")
              echo "- $(git log -1 --format=%s "$c")${src:+, $src}"
              git log -1 --format='%(trailers:key=Mirror-Conflict,valueonly)' "$c" | sed '/^$/d; s/.*/  - conflict: `&`/'
              git log -1 --format='%(trailers:key=Mirror-Manual-Port,valueonly)' "$c" | sed '/^$/d; s/.*/  - needs manual port: `&`/'
              git log -1 --format='%(trailers:key=Mirror-Dropped,valueonly)' "$c" | sed '/^$/d; s/.*/  - dropped, generated client: `&`/'
            done
          } > "$body"
          title="Mirror langsmith-sdk ($(git rev-list --count origin/main..HEAD) commits)"

          gh label create mirror --repo "$GITHUB_REPOSITORY" --color 0075ca --description "Mirrored from langsmith-sdk" --force
          gh label create needs-manual-merge --repo "$GITHUB_REPOSITORY" --color d93f0b --description "Mirrored patch conflicted; resolve by hand" --force
          # REST, not gh pr create/edit: their GraphQL label/reviewer mutations fail on this repo
          api="repos/$GITHUB_REPOSITORY"
          if [ -z "$PR" ]; then
            PR=$(gh api -X POST "$api/pulls" -f base=main -f head="$BRANCH" -f title="$title" -F body=@"$body" --jq .number)
            gh api -X POST "$api/pulls/$PR/requested_reviewers" -f 'reviewers[]=thibautlehmann' -f 'reviewers[]=KiewanVillatel' >/dev/null
          else
            gh api -X PATCH "$api/pulls/$PR" -f title="$title" -F body=@"$body" >/dev/null
          fi
          labels=(-f 'labels[]=mirror'); [ -n "$CONFLICT" ] && labels+=(-f 'labels[]=needs-manual-merge')
          gh api -X POST "$api/issues/$PR/labels" "${labels[@]}" >/dev/null
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.pr.outputs.url != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.INGESTION_CI_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ toJSON(secrets.INGESTION_TEAM_SLACK_CHANNEL_ID) }}
            text: |
              <@U0BSQM2BQJ3> ${{ steps.mirror.outputs.added }} langsmith-sdk commit(s) added to the mirror PR${{ steps.mirror.outputs.conflict != '' && ', *needs manual merge*' || '' }}: ${{ steps.pr.outputs.url }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.INGESTION_CI_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ toJSON(secrets.INGESTION_TEAM_SLACK_CHANNEL_ID) }}
            text: |
              <@U0BSQM2BQJ3> mirror from langsmith-sdk failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

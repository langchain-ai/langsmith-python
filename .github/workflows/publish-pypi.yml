name: Publish PYPI
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  # Build runs third-party code (build backend, Socket action) and holds no
  # write permission at all. The two jobs after it only download the artifact:
  # attach gets contents: write for the release upload, publish gets the OIDC
  # token for PyPI. Neither runs anything but GitHub's CLI or the pypa action.
  build:
    if: github.repository == 'langchain-ai/langsmith-python' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-?rc\.?[0-9]+)?$ ]]; then
            echo "Expected a stable vX.Y.Z or release-candidate tag" >&2
            exit 1
          fi
          PRERELEASE=false
          if [[ "$RELEASE_TAG" == *rc* ]]; then
            PRERELEASE=true
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq "select(.isDraft == false and .isPrerelease == $PRERELEASE)" | grep -q .

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Protect dependency downloads
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'
          python-version: '3.11'

      - name: Check the package version matches the release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release and package versions differ'
          PY

      - name: Build distributions
        run: uv build

      - name: Hand the distributions to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for ASSET in dist/*.whl dist/*.tar.gz; do
            test -f "$ASSET"
            if printf '%s\n' "$RELEASE_ASSETS" | grep -Fxq "$(basename "$ASSET")"; then
              continue
            fi
            gh release upload "$RELEASE_TAG" "$ASSET"
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
